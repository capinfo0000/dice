<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>チンチロ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <span class="title">🎲 チンチロ</span>
        <div class="top-right">
          <button id="settingsBtn" class="icon-btn" title="設定">⚙</button>
          <button id="modeBtn" class="icon-btn" title="モード切替">3チロ</button>
        </div>
      </header>

      <!-- 結果タイトル -->
      <div id="resultTitle" class="result-title">　</div>

      <!-- 振り直しドット -->
      <div id="rollDots" class="roll-dots"></div>

      <!-- 鉢 -->
      <div id="bowl" class="bowl">
        <div id="diceWrap" class="dice-wrap"></div>
      </div>

      <!-- メインボタン -->
      <div class="action">
        <button id="stopBtn" class="action-btn alt hidden">この役で止める</button>
        <button id="actionBtn" class="action-btn">サイコロを振る</button>
      </div>

      <!-- プレイヤータブ -->
      <div id="players" class="players"></div>

      <!-- 結果（飲み）オーバーレイ -->
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <div id="ovWinner" class="ov-winner"></div>
          <div id="ovSd" class="ov-sd"></div>
          <div class="ov-drink">🍺</div>
          <div id="ovLoser" class="ov-loser"></div>
          <div id="ovGulps" class="ov-gulps"></div>
          <ul id="ovList" class="ov-list"></ul>
          <button id="againBtn" class="action-btn">もう一局</button>
        </div>
      </div>

      <!-- 設定画面 -->
      <div id="settings" class="overlay hidden">
        <div class="overlay-card settings-card">
          <div class="settings-title">⚙ 設定</div>

          <div class="settings-sec">止め方（全員共通）</div>
          <label class="opt">
            <input type="checkbox" id="yakudomeChk" />
            <span><b>役どめ</b><br /><small>ON：役が出たら自動で確定（役なしの間だけ振り直し）。<br />OFF：役が出ても最大3回まで自分で振り直せる（「この役で止める」で確定）。</small></span>
          </label>

          <div class="settings-sec">サイコロ</div>
          <label class="opt">
            <input type="checkbox" id="dice456Chk" />
            <span><b>456サイコロ</b><br /><small>4・5・6しか出ないイカサマ賽。シゴロやゾロ目が出やすい。</small></span>
          </label>

          <div class="settings-sec">モード</div>
          <div class="seg" id="segMode">
            <button data-v="3">3チロ（3個）</button>
            <button data-v="4">4チロ（4個）</button>
          </div>

          <div class="settings-sec">最大振り直し回数（3チロ）</div>
          <div class="seg" id="segThrows">
            <button data-v="1">1回</button>
            <button data-v="2">2回</button>
            <button data-v="3">3回</button>
          </div>

          <div class="settings-sec">チョンボ</div>
          <label class="opt">
            <input type="checkbox" id="chonboChk" />
            <span><b>チョンボあり</b><br /><small>サイコロが鉢から飛び出す大失敗。出た人は即負けでやり直し。</small></span>
          </label>
          <div class="seg" id="segChonbo">
            <button data-v="0.01">1%</button>
            <button data-v="0.03">3%</button>
            <button data-v="0.05">5%</button>
            <button data-v="0.1">10%</button>
          </div>

          <div class="settings-sec">効果音</div>
          <label class="opt">
            <input type="checkbox" id="soundChk" />
            <span><b>効果音</b><br /><small>サイコロの音などの ON / OFF。</small></span>
          </label>
          <div class="vol">
            <span>🔈</span>
            <input type="range" id="volRange" min="0" max="100" />
            <span>🔊</span>
          </div>

          <button id="settingsClose" class="action-btn">閉じる</button>
        </div>
      </div>
    </div>

    <script src="chinchiro.js"></script>
    <script src="client.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>チンチロ オンライン対戦</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>🎲 チンチロ</h1>
        <p class="subtitle">親・子なし　一番強い役が勝ち</p>
      </header>

      <!-- 参加フォーム -->
      <section id="joinScreen" class="screen">
        <div class="card join-card">
          <h2>テーブルに参加</h2>
          <p class="hint">
            同じ端末でも、ブラウザのタブを増やせば人数分のプレイヤーで対戦できます。
          </p>
          <input
            id="nameInput"
            type="text"
            maxlength="12"
            placeholder="名前を入力（12文字まで）"
            autocomplete="off"
          />
          <button id="joinBtn" class="btn primary">参加する</button>
          <ul id="lobbyList" class="lobby-list"></ul>
        </div>
      </section>

      <!-- ゲーム画面 -->
      <section id="gameScreen" class="screen hidden">
        <div id="phaseBanner" class="phase-banner"></div>
        <div id="players" class="players"></div>

        <div class="controls">
          <button id="rollBtn" class="btn primary big">🎲 振る</button>
          <button id="readyBtn" class="btn">準備OK</button>
        </div>

        <div class="log-wrap">
          <h3>実況</h3>
          <ul id="log" class="log"></ul>
        </div>
      </section>

      <section class="rules card">
        <h3>役と配当</h3>
        <ul>
          <li><b>ピンゾロ</b>（1・1・1）… ×5　最強</li>
          <li><b>アラシ</b>（ゾロ目）… ×3　数字が大きいほど強い</li>
          <li><b>シゴロ</b>（4・5・6）… ×2</li>
          <li><b>出目</b>（ペア＋1つ）… ×1　残り1つの目が大きいほど強い</li>
          <li><b>役なし</b>… 3回振っても役が出なければ負け（ションベン）</li>
          <li><b>ヒフミ</b>（1・2・3）… 負け役</li>
        </ul>
      </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
  </body>
</html>
